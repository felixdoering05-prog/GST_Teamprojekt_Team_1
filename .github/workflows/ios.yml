name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    name: IFC-Viewer (Tests + Build)
    # build.mjs komprimiert die Assets mit Apples Compression-Framework (LZFSE, per Swift),
    # deshalb dieselbe verfügbare macOS/Xcode-Umgebung wie der App-Build verwenden.
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/ifc-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/ifc-viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node build.mjs
      - name: Gebündelte App-Assets entsprechen dem Build
        working-directory: .
        run: |
          assets="ios/KI Trifft Gebäude APP/KI Trifft Gebäude APP/IFCAssets"
          if ! git diff --exit-code --stat -- "$assets" || [ -n "$(git status --porcelain -- "$assets")" ]; then
            echo "::error::IFCAssets weichen vom Build ab. Bitte lokal 'cd ios/ifc-viewer && npm ci && node build.mjs' ausführen und die Dateien in IFCAssets mitcommitten."
            git status --short -- "$assets"
            exit 1
          fi

  app:
    name: iOS-App (Simulator-Build ohne Signatur)
    # Die App hat iOS 27.0 als Deployment Target und braucht das iOS-27-SDK.
    # macos-latest hat derzeit nur Xcode 26; Xcode 27 gibt es im Image "xcode-27".
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 27.2 auswählen
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Build
        working-directory: ios/KI Trifft Gebäude APP
        run: |
          xcodebuild -quiet build \
            -project "KI Trifft Gebäude APP.xcodeproj" \
            -scheme "KI Trifft Gebäude APP" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
