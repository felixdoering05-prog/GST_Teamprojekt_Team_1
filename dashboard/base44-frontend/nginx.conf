server {
    listen 80;
    client_max_body_size 26m;
    root /usr/share/nginx/html;

    location = /projekt {
        absolute_redirect off;
        return 308 /projekt/$is_args$args;
    }

    location ^~ /projekt/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
    }
}
