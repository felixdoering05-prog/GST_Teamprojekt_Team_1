server {
    listen 80;
    client_max_body_size 26m;
    root /usr/share/nginx/html;

    location = /projekt {
        absolute_redirect off;
        return 308 /projekt/$is_args$args;
    }

    location ^~ /projekt/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = "/ifc-viewer/index.html&heat=true" {
        absolute_redirect off;
        return 302 /ifc-viewer/index.html?campus=d21&map-only=true&heat=true;
    }

    location ^~ /ifc-viewer/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
    }
}
