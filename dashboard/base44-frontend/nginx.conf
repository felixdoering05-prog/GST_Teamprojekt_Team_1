server {
    listen 80;
    client_max_body_size 26m;
    root /usr/share/nginx/html;

    location = /projekt {
        absolute_redirect off;
        return 308 /projekt/$is_args$args;
    }

    location ^~ /projekt/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = "/ifc-viewer/index.html&heat=true" {
        absolute_redirect off;
        return 302 /ifc-viewer/index.html?campus=d21&map-only=true&heat=true;
    }

    # Viewer-Dateien haben keine Hash-Namen: Browser müssen bei jedem Laden nachfragen (ETag), sonst bleibt nach einem Deployment der alte Viewer im Cache.
    location ^~ /ifc-viewer/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Universal Links: Raum-QR-Etiketten öffnen die Raumkarte direkt in der iPhone-App.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
    }
}
