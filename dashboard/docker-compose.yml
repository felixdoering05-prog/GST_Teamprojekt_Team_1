services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: d21
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevonly}
      POSTGRES_DB: d21
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d21"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://d21:${DB_PASSWORD:-localdevonly}@db:5432/d21
      D21_ADMIN_USER_IDS: ${D21_ADMIN_USER_IDS:-}
      D21_ADMIN_SNAPSHOT_FILE: /run/d21-admin/status.json
      D21_CAMPUS_BUILDING_ID: ${D21_CAMPUS_BUILDING_ID:-}
      D21_CAMPUS_MODEL_FILE: /run/d21-models/H_DA_D21_Final.ifc
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY_FILE: /run/d21-ai/gemini-api-key
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_PASSWORD_FILE: /run/d21-mail/smtp-password
      PASSWORD_RESET_SECRET_FILE: /run/d21-mail/reset-secret
    volumes: ['./private-mail:/run/d21-mail:ro', '${D21_AI_CONFIG_DIR:-./private-ai}:/run/d21-ai:ro', '${D21_ADMIN_STATUS_DIR:-./private-admin}:/run/d21-admin:ro', '${D21_CAMPUS_MODELS_DIR:-./private-models}:/run/d21-models:ro']
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./base44-frontend
    depends_on: [api]
    ports: ['127.0.0.1:8088:80']
    restart: unless-stopped
  n8n:
    build: ./n8n
    restart: unless-stopped
    ports: ['127.0.0.1:5678:5678']
    mem_limit: 768m
    cpus: 0.75
    environment:
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: 'false' # Only loopback access through SSH; no public HTTP editor.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_CONCURRENCY_PRODUCTION_LIMIT: '1'
      EXECUTIONS_TIMEOUT: '90'
      EXECUTIONS_TIMEOUT_MAX: '90'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '72'
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: '5000'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      NODE_OPTIONS: --max-old-space-size=384
    volumes: [n8ndata:/home/node/.n8n]
volumes:
  n8ndata:
  dbdata:
